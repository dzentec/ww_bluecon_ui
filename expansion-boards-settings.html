<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WW BlueCon — Expansion Boards</title>
<link rel="stylesheet" href="themes/default.css">
<script src="themes/theme.js"></script>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--font-sans); background:var(--chrome-stage); color:var(--color-text); padding:var(--space-12) var(--space-4) var(--space-12); }
  button, select, input { font-family:var(--font-sans); }

  .phone { width:375px; margin:0 auto; background:var(--color-bg); border-radius:var(--chrome-radius); box-shadow:0 30px 60px var(--chrome-shadow), 0 0 0 10px var(--chrome-frame), 0 0 0 11px var(--chrome-edge); overflow:hidden; height:760px; display:flex; flex-direction:column; position:relative; }
  .status-ios { height:28px; display:flex; align-items:center; justify-content:space-between; padding:0 var(--space-6); font-size:var(--text-sm); font-weight:600; color:var(--color-text); flex-shrink:0; }

  .shell-header { display:flex; align-items:center; justify-content:space-between; padding:var(--space-3) var(--space-4) var(--space-2); flex-shrink:0; }
  .role-badge { background:var(--color-primary); color:var(--color-on-primary); font-size:var(--text-sm); font-weight:600; padding:var(--space-1) var(--space-3); border-radius:var(--radius-pill); }
  .conn-status { display:flex; align-items:center; gap:var(--space-2); font-size:var(--text-sm); font-weight:500; color:var(--color-success-text); }
  .conn-status .status-dot { width:7px; height:7px; border-radius:50%; background:var(--color-success); flex-shrink:0; }
  .shell-header-right { display:flex; align-items:center; gap:var(--space-3); }
  .exit-device-btn { display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; color:var(--color-text-muted); text-decoration:none; flex-shrink:0; }
  .exit-device-btn:hover { background:var(--color-fill); color:var(--color-text); }

  .screen-title-row { display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3) var(--space-4) var(--space-3); flex-shrink:0; }
  .back-btn { appearance:none; border:none; background:none; color:var(--color-text); cursor:pointer; padding:2px; display:flex; flex-shrink:0; }
  .screen-title-text { font-size:var(--text-xl); font-weight:600; }

  .content { flex:1; overflow-y:auto; padding-bottom:var(--space-12); position:relative; }

  .section-card { background:var(--color-surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); margin:0 var(--space-6) var(--space-4); padding:var(--space-4); }
  .section-title { font-size:var(--text-lg); font-weight:700; color:var(--color-text); margin-bottom:var(--space-4); }
  .subsection-divider { height:1px; background:var(--color-border); margin:var(--space-4) 0; }
  .subsection-heading { font-size:var(--text-sm); font-weight:600; color:var(--color-text); margin-bottom:var(--space-3); }
  .field-helper { font-size:var(--text-xs); color:var(--color-text-muted); font-style:italic; margin-top:var(--space-1); line-height:1.4; }

  /* Board row — links through to that board's own settings page; chevron for navigation, dot for status */
  .board-row { position:relative; display:flex; align-items:center; gap:var(--space-1); padding:var(--space-3) var(--space-12) var(--space-3) var(--space-4); background:var(--color-surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); margin:0 var(--space-6) var(--space-6); text-decoration:none; color:inherit; border:1.5px solid transparent; transition:border-color 0.15s ease; }
  .board-row:hover { border-color:var(--color-accent); }
  .board-name { font-size:var(--text-lg); font-weight:700; color:var(--color-text); width:58px; flex-shrink:0; }
  .board-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:var(--space-1); }
  .board-desc { font-size:var(--text-sm); color:var(--color-text-muted); }
  .board-serial { font-size:var(--text-sm); color:var(--color-text-muted); }
  .board-chevron { color:var(--color-text-muted); flex-shrink:0; }
  /* Status dot sits at the card's top-right corner, not centered with the row — matches the design exactly. */
  .board-dot { position:absolute; top:12px; right:14px; width:8px; height:8px; border-radius:50%; background:var(--color-success); flex-shrink:0; }

  .board-slot-empty { position:relative; border:1px dashed var(--color-border-strong); border-radius:var(--radius-lg); margin:0 var(--space-6) var(--space-6); height:55px; }
  .board-slot-empty .slot-dot { position:absolute; top:12px; right:14px; width:8px; height:8px; border-radius:50%; border:1px solid var(--color-border-strong); }

  .io-port-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--space-3); }
  .io-seg { display:flex; background:var(--color-fill); border-radius:var(--radius-md); padding:var(--space-1); width:192px; height:40px; flex-shrink:0; }
  .io-seg.locked { opacity:0.5; pointer-events:none; }
  .io-seg button { flex:1; appearance:none; border:none; background:transparent; color:var(--color-text-muted); font-size:var(--text-md); font-weight:600; padding:0 2px; border-radius:var(--radius-md); cursor:pointer; transition:all 0.2s ease; }
  .io-seg button.active { background:var(--color-surface); color:var(--color-primary); box-shadow:var(--shadow-sm); }

  .switch { position:relative; width:42px; height:25px; flex-shrink:0; display:inline-block; }
  .switch input { opacity:0; width:0; height:0; position:absolute; }
  .switch .track { position:absolute; inset:0; background:var(--color-border); border-radius:var(--radius-pill); transition:background 0.2s ease; cursor:pointer; }
  .switch .thumb { position:absolute; top:3px; left:3px; width:19px; height:19px; background:var(--color-surface); border-radius:50%; transition:transform 0.2s ease; box-shadow:var(--shadow-xs); }
  .switch input:checked ~ .track { background:var(--color-primary); }
  .switch input:checked ~ .track .thumb { transform:translateX(17px); }
  .global-failsafe-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--space-4); }
  .global-failsafe-head .section-title { margin-bottom:0; }

  /* ---------- Floating sibling-screens bar: flip through this tab's icons without going back to Home ---------- */
  .ww-tabbar-wrap { position:absolute; left:0; right:0; bottom:0; padding:0 0 var(--space-4); z-index:20; pointer-events:none; }
  .ww-tabbar { margin:0 var(--space-4); background:color-mix(in srgb, var(--color-surface) 86%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-radius:var(--radius-lg); box-shadow:var(--shadow-float); display:flex; justify-content:space-between; gap:2px; padding:var(--space-2) var(--space-3); overflow-x:auto; scrollbar-width:none; pointer-events:auto; }
  .ww-tabbar::-webkit-scrollbar { display:none; }
  .ww-tabbar-item { flex:0 0 52px; width:52px; min-width:0; display:flex; flex-direction:column; align-items:center; gap:var(--space-1); text-decoration:none; color:var(--color-text-muted); padding:var(--space-1) 1px; border-radius:var(--radius-md); }
  .ww-tabbar-icon { width:30px; height:30px; border-radius:50%; border:1.3px solid var(--color-accent); color:var(--color-accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background 0.15s ease, transform 0.1s ease; }
  .ww-tabbar-label { font-size:var(--text-xs); font-weight:500; text-align:center; line-height:1.15; width:100%; }
  .ww-tabbar-item.active .ww-tabbar-icon { background:var(--color-primary); border-color:var(--color-primary); color:var(--color-on-primary); }
  .ww-tabbar-item.active .ww-tabbar-label { color:var(--color-text); font-weight:700; }
  .ww-tabbar-item:not(.active):hover .ww-tabbar-icon { background:var(--color-accent-bg); }
  .ww-tabbar-item:not(.active):active .ww-tabbar-icon { transform:scale(0.92); background:var(--color-accent-bg); }
</style>
</head>
<body>

<div class="phone">
  <div class="status-ios"><span>9:41</span><span>●●●●  5G  🔋</span></div>
  <div class="shell-header">
    <span class="role-badge">Central Unit</span>
    <div class="shell-header-right">
      <span class="conn-status"><span class="status-dot"></span>Connected</span>
      <a class="exit-device-btn" href="device-scan.html" title="Exit device"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></a>
    </div>
  </div>
  <div class="screen-title-row">
    <button class="back-btn" onclick="window.location.href='home.html'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="screen-title-text">Expansion Boards</span>
  </div>

  <div class="content">
    <div id="board-list"></div>

    <div class="section-card">
      <div class="global-failsafe-head">
        <div class="section-title">Global Relay Failsafe</div>
        <label class="switch"><input type="checkbox" id="g-enabled" checked onchange="setGlobalEnabled(this.checked)"><span class="track"><span class="thumb"></span></span></label>
      </div>
      <div class="io-port-head" style="margin-bottom:var(--space-2);">
        <span style="font-size:var(--text-sm);color:var(--color-text-muted);font-weight:500;">On Power Loss</span>
        <div class="io-seg" id="g-pl">
          <button type="button" class="active" onclick="setGlobalRelay(event)">Fail Secure</button>
          <button type="button" onclick="setGlobalRelay(event)">Fail Safe</button>
        </div>
      </div>
      <div class="io-port-head" style="margin-bottom:0;">
        <span style="font-size:var(--text-sm);color:var(--color-text-muted);font-weight:500;">On Radio-Link Loss</span>
        <div class="io-seg" id="g-rl">
          <button type="button" class="active" onclick="setGlobalRelay(event)">Fail Secure</button>
          <button type="button" onclick="setGlobalRelay(event)">Fail Safe</button>
        </div>
      </div>
    </div>
  </div>

  <div class="ww-tabbar-wrap">
    <div class="ww-tabbar" id="ww-tabbar">
      <a class="ww-tabbar-item" href="radio.html"><span class="ww-tabbar-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 16.1C1 12.2 1 5.8 4.9 1.9m2.9 2.8a6.14 6.14 0 0 0-.8 7.5"/><circle cx="12" cy="9" r="2"/><path d="M16.2 4.8c2 2 2.26 5.11.8 7.47M19.1 1.9a9.96 9.96 0 0 1 0 14.1m-9.6 2h5M8 22l4-11l4 11"/></svg></span><span class="ww-tabbar-label">Radio</span></a>
      <a class="ww-tabbar-item" href="data-port.html"><span class="ww-tabbar-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 19a1 1 0 0 1-1-1v-2a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2a1 1 0 0 1-1 1zm0 2v-2"/><path d="M19 14V6.5a1 1 0 0 0-7 0v11a1 1 0 0 1-7 0V10m16 11v-2M3 5V3"/><path d="M4 10a2 2 0 0 1-2-2V6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2a2 2 0 0 1-2 2zm3-5V3"/></svg></span><span class="ww-tabbar-label">Data Port</span></a>
      <a class="ww-tabbar-item" href="io-ports.html"><span class="ww-tabbar-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="8" width="18" height="8" rx="4"/><circle cx="8" cy="12" r="2.6"/></svg></span><span class="ww-tabbar-label">I/O Ports</span></a>
      <span class="ww-tabbar-item active"><span class="ww-tabbar-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M11 9h4a2 2 0 0 0 2-2V3"/><circle cx="9" cy="9" r="2"/><path d="M7 21v-4a2 2 0 0 1 2-2h4"/><circle cx="15" cy="15" r="2"/></svg></span><span class="ww-tabbar-label">Expansion<br>Boards</span></span>
      <a class="ww-tabbar-item" href="network.html"><span class="ww-tabbar-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8v1m4-1v1m4-1v1m1 8a2 2 0 0 0-1.765 1.059l-.47.882A2 2 0 0 1 15 20H9a2 2 0 0 1-1.765-1.059l-.47-.882A2 2 0 0 0 5 17H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2zM6 8v1"/></svg></span><span class="ww-tabbar-label">Ethernet<br>Network</span></a>
      <a class="ww-tabbar-item" href="device-behavior.html"><span class="ww-tabbar-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></span><span class="ww-tabbar-label">Device<br>Behavior</span></a>
    </div>
  </div>
</div>

<script>
document.querySelector('#ww-tabbar .active')?.scrollIntoView({inline:'center', block:'nearest'});

const boards = [
  { name:'W2', desc: 'Desc: 2 Wiegand ports', serial: 'Serial: W2B-0021-7743', href: 'board-w2.html' },
  { name:'R2IO', desc: 'Desc: 2 Inputs & 2 Relay out', serial: 'Serial: R2IOB-0237-7743', href: 'board-r2io.html' },
];
const MAX_BOARDS = 4;

function renderBoards(){
  const list = document.getElementById('board-list');
  let html = boards.map(b => `
    <a class="board-row" href="${b.href}">
      <span class="board-name">${b.name}</span>
      <span class="board-info"><span class="board-desc">${b.desc}</span><span class="board-serial">${b.serial}</span></span>
      <svg class="board-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      <span class="board-dot"></span>
    </a>`).join('');
  for(let i = boards.length; i < MAX_BOARDS; i++){
    html += `<div class="board-slot-empty"><span class="slot-dot"></span></div>`;
  }
  list.innerHTML = html;
}
// Shared with board-r2io.html: while Global Relay Failsafe is on, its modes apply to every relay on the boards.
function loadGlobal(){ try { return Object.assign({enabled:true, pl:'secure', rl:'secure'}, JSON.parse(localStorage.getItem('wwGlobal')||'{}')); } catch(e) { return {enabled:true, pl:'secure', rl:'secure'}; } }
function saveGlobal(g){ try { localStorage.setItem('wwGlobal', JSON.stringify(g)); } catch(e) {} }
function paintSeg(id, mode){ document.querySelectorAll('#'+id+' button').forEach((b,i)=>b.classList.toggle('active', (i===1)===(mode==='safe'))); }
function setGlobalEnabled(on){ const g=loadGlobal(); g.enabled=on; saveGlobal(g); }
function setGlobalRelay(evt){
  const btn = evt.currentTarget;
  const seg = btn.parentElement;
  seg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const g=loadGlobal(); const mode = btn.textContent.trim()==='Fail Safe' ? 'safe' : 'secure';
  if(seg.id==='g-pl') g.pl=mode; else g.rl=mode;
  saveGlobal(g);
}
(function(){ const g=loadGlobal(); document.getElementById('g-enabled').checked=g.enabled; paintSeg('g-pl',g.pl); paintSeg('g-rl',g.rl); })();

renderBoards();
</script>
</body>
</html>
